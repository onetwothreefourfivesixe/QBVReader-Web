<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QBVReader</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>

<body>
    <div class="navbar bg-dark">
        <nav class="w-100 d-flex align-items-center">
            <img src="{{ url_for('static', filename='assets/favicon-32x32.png') }}" alt="QBVReader Logo"
                class="navbar-logo">
            <ul class="nav">
                <li class="nav-item">
                    <a class="nav-link text-white" href="{{ url_for('home') }}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="/about">About</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="https://forms.gle/pro5Zvx4UDqc92Jd9" target="_blank">
                        <i class="bi bi-bug"></i> Report Bug
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Add this right after the navbar -->
    <div class="notification-container">
        <div class="notification hidden">
            <span class="notification-message"></span>
        </div>
    </div>

    <div class="timer-display hidden">
        <div class="buzz-timer hidden">
            <span class="timer-label">Time to buzz:</span>
            <span class="timer-value">8</span>
        </div>
        <div class="answer-timer hidden">
            <span class="timer-label">Time to answer:</span>
            <span class="timer-value">5</span>
        </div>
    </div>

    <div class="main-container">
        <!-- Blue section - Game settings -->
        <div class="game-settings">
            <div class="settings-scroll">
                <div class="settings-group">
                    <h3>Game Settings</h3>
                    <div class="setting-item">
                        <div class="text-display-controls" id="text-toggle-container">
                            <label class="switch">
                                <input type="checkbox" id="show-text-toggle" class="settings-input">
                                <span class="slider round"></span>
                            </label>
                            <span>Show Tossup Text</span>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label class="switch">
                            <input type="checkbox" id="allow-rebuzz-toggle">
                            <span class="slider round"></span>
                        </label>
                        <span>Allow Re-buzzing</span>
                    </div>
                    <div class="setting-item">
                        <button id="resetScores" class="reset-button">Reset Scores</button>
                    </div>
                    <div class="setting-item">
                        <label for="reading-speed">Reading Speed: <span id="reading-speed-value">1.0x</span></label>
                        <input type="range" id="reading-speed" min="0.75" max="1.5" step="0.05" value="1.0">
                    </div>
                </div>
            </div>
        </div>

        <div class="shortcut-box">
            <p>Shortcuts:</p>
            <p><strong>N</strong>: Next</p>
            <p><strong>P</strong>: Pause</p>
            <p><strong>Spacebar</strong>: Buzz</p>
        </div>

        <!-- Green section - Tossup interaction area -->
        <div class="tossup-area">
            <div class="tossup-controls">
                <div class="button-container">
                    <button id="nextTossup" class="next-tossup-button" title="Shortcut: N">Next</button>
                    <button id="pauseButton" class="pause-button" title="Shortcut: P">Pause</button>
                    <button id="buzzButton" class="buzz-button" title="Shortcut: Spacebar">Buzz</button>
                    <div class="score-display">
                        <div class="score-item">
                            <span class="score-label">Powers:</span>
                            <span class="score-value" id="powerScore">0</span>
                        </div>
                        <div class="score-item">
                            <span class="score-label">Tens:</span>
                            <span class="score-value" id="tenScore">0</span>
                        </div>
                        <div class="score-item">
                            <span class="score-label">Negs:</span>
                            <span class="score-value" id="negScore">0</span>
                        </div>
                        <div class="score-item">
                            <span class="score-label">Total:</span>
                            <span class="score-value" id="totalScore">0</span>
                        </div>
                    </div>
                </div>
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
            </div>

            <div class="tossup-text-container">
                <div class="tossup-metadata hidden">
                    <div class="set-name"></div>
                </div>
                <div class="text-display hidden">
                    <div class="tossup-text"></div>
                </div>
                <div class="answer-display hidden">
                    <div id="answer" class="answer"></div>
                </div>
                <button id="toggleCorrect" class="toggle-correct-button hidden">Toggle Correct/Incorrect</button>
            </div>
            <div class="answer-input-container hidden">
                <input type="text" id="answerInput" placeholder="Type your answer..." disabled>
                <button id="submitAnswer" class="submit-button" disabled>Submit</button>
            </div>

            <!-- Hidden audio element -->
            <audio id="audio" class="hidden">
                <source id="audioSource" src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Red section - Question settings -->
        <div class="question-settings">
            <div class="settings-scroll">
                <div class="controls">
                    <div class="input-group">
                        <div class="collapsible-header collapsed" data-target="difficulty-content">
                            <label>Difficulty Levels:</label>
                            <span class="collapse-icon">▼</span>
                        </div>
                        <div id="difficulty-content" class="collapsible-content collapsed">
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="1" class="settings-input"> 1 -
                                    Middle
                                    School
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="2" class="settings-input"> 2 - Easy
                                    High
                                    School
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="3" class="settings-input"> 3 -
                                    Regular
                                    High School
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="4" class="settings-input"> 4 - Hard
                                    High
                                    School
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="5" class="settings-input"> 5 -
                                    National
                                    High School
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="6" class="settings-input"> 6 - Easy
                                    College
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="7" class="settings-input"> 7 -
                                    Medium
                                    College
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="8" class="settings-input"> 8 -
                                    Regionals
                                    College
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="9" class="settings-input"> 9 -
                                    Nationals
                                    College
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="difficulty" value="10" class="settings-input"> 10 -
                                    Hard Nationals College
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="input-group">
                        <div class="collapsible-header collapsed" data-target="subjects-content">
                            <label>Subjects:</label>
                            <span class="collapse-icon">▼</span>
                        </div>
                        <div id="subjects-content" class="collapsible-content collapsed">
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="science" class="settings-input">
                                    Science
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="History" class="settings-input">
                                    History
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Literature" class="settings-input">
                                    Literature
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Fine Arts" class="settings-input"> Fine
                                    Arts
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Geography" class="settings-input">
                                    Geography
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Religion" class="settings-input">
                                    Religion
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Mythology" class="settings-input">
                                    Mythology
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Philosophy" class="settings-input">
                                    Philosophy
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Social Science" class="settings-input">
                                    Social Science
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Current Events" class="settings-input">
                                    Current Events
                                </label>
                                <label class="checkbox-label">
                                    <input type="checkbox" name="subject" value="Trash" class="settings-input"> Trash
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
